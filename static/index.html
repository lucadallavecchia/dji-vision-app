<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJI Vision</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header {
    padding: 12px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 1.1rem; }
  header code {
    background: #222;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85rem;
  }
  .stream-wrap {
    width: 100%;
    max-width: 1000px;
    padding: 0 8px 16px;
    box-sizing: border-box;
  }
  img#stream {
    width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    background: #000;
  }
</style>
</head>
<body>
  <header>
    <h1>DJI Vision — Live Detection</h1>
    <div>RTMP per DJI Fly: <code id="rtmp-url">caricamento...</code></div>
  </header>
  <div class="stream-wrap">
    <img id="stream" src="/stream" alt="Live stream">
  </div>
  <script>
    fetch("/info").then(r => r.json()).then(d => {
      document.getElementById("rtmp-url").textContent = d.rtmp_url;
    });
  </script>
</body>
</html>
